{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MarketPro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .login-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            height: 60px;
        }

        h2 {
            color: #0056b3;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 24px;
        }

        form p {
            text-align: left;
            margin-bottom: 18px;
        }

        form p label {
            display: block;
            font-weight: 600;
            color: #0056b3;
            margin-bottom: 6px;
            font-size: 14px;
        }

        form p input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        form p input:focus {
            border-color: #00a8ff;
            box-shadow: 0 0 0 3px rgba(0, 168, 255, 0.2);
        }

        /* --- बटनको रङ यहाँ परिवर्तन गर्नुहोस् --- */
        button {
            width: 100%;
            padding: 14px;
            background-color: #0056b3; /* यहाँ आफ्नो मनपर्ने रङको कोड राख्नुहोस् */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #003d82; /* माउस हाल्दा देखिने रङ */
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <img src="{% static 'images/logo.png' %}" alt="MarketPro Logo">
        </div>
        
        <h2>Login to MarketPro</h2>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>
    </div>

</body>
</html>
